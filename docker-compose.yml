services:
  postgres:
    image: postgres:17
    container_name: jpa_playbook
    environment:
      POSTGRES_DB: jpa_playbook
      POSTGRES_USER: jpa_user
      POSTGRES_PASSWORD: ${JPA_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - jpa_playbook_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_jpa_playbook
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8082:80"
    depends_on:
      - postgres

volumes:
  jpa_playbook_data: